# Publication de l'application sur GitLab Pages (site statique, aucun build).
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir public
    - cp -r index.html accessibilite.html icon.png css scripts assets LICENSE public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
